[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gol-training"
version = "0.4.0"
description = "Offline PyTorch training, player-grouped evaluation, and ONNX export for Gol ya Pooch Phase 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.4",
  "torch==2.15.0",
  "onnx==1.23.2",
  "onnxscript==0.7.2",
  "onnxruntime==1.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
